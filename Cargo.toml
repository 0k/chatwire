[package]
name = "chatwire"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "One client interface over several instant messaging services: receive every event, and write back"
license = "MIT"
publish = false

[features]
default = ["matrix"]
matrix = ["dep:matrix-sdk"]

[dependencies]
async-trait = "0.1"
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "sqlite",
    "e2e-encryption",
    "rustls-aws-lc-rs",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
indoc = "2"
rpassword = "7"
similar = "2"
tempfile = "3"

[[example]]
name = "watch"
path = "examples/watch.rs"
required-features = ["matrix"]
